spring.application.name=jemari-backend

# Server Configuration
server.port=8080

# Database Configuration (Default Template)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jemari_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


jemari.jwt.secret=${JWT_SECRET:yTSozlihtlhtBqGqkhl268xhC1+m7+8007k0xHrP1jZH5+7qqhXB3rH/+nCKN4uQOuwzDdZexjQhwnQCCOarQg==}
jemari.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


spring.config.import=optional:file:./application-local.properties